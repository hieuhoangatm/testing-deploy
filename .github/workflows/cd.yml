name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - staging
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-develop:
    runs-on: self-hosted
    needs: docker
    if: ${{ github.ref == 'refs/heads/develop' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy develop environment
        env:
          APP_PORT: ${{ secrets.APP_PORT_DEVELOP }}
        run: |
          set -e
          DEPLOY_PATH="${HOME}/hayden-develop"
          mkdir -p "${DEPLOY_PATH}"
          cp deploy/docker-compose.yml "${DEPLOY_PATH}/docker-compose.yml"
          cd "${DEPLOY_PATH}"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-latest" > .env
          echo "APP_PORT=${APP_PORT:-18080}" >> .env
          echo "${{ github.token }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

  deploy-staging:
    runs-on: self-hosted
    needs: docker
    if: ${{ github.ref == 'refs/heads/staging' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy staging environment
        env:
          APP_PORT: ${{ secrets.APP_PORT_STAGING }}
        run: |
          set -e
          DEPLOY_PATH="${HOME}/hayden-staging"
          mkdir -p "${DEPLOY_PATH}"
          cp deploy/docker-compose.yml "${DEPLOY_PATH}/docker-compose.yml"
          cd "${DEPLOY_PATH}"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest" > .env
          echo "APP_PORT=${APP_PORT:-28080}" >> .env
          echo "${{ github.token }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

  deploy-production:
    runs-on: self-hosted
    needs: docker
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy production environment
        env:
          APP_PORT: ${{ secrets.APP_PORT_PROD }}
        run: |
          set -e
          DEPLOY_PATH="${HOME}/hayden-production"
          mkdir -p "${DEPLOY_PATH}"
          cp deploy/docker-compose.yml "${DEPLOY_PATH}/docker-compose.yml"
          cd "${DEPLOY_PATH}"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest" > .env
          echo "APP_PORT=${APP_PORT:-8080}" >> .env
          echo "${{ github.token }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
