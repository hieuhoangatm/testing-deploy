<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main>
    <section class="page-hero">
        <div class="container">
            <h1 class="page-title">Blog</h1>
            <p class="page-subtitle">Chia sẻ về Java, Spring Boot, Architecture và Backend Development</p>
        </div>
    </section>

    <section class="blog-list-section">
        <div class="container">
            <!-- Search -->
            <div class="search-bar">
                <form method="get" action="/blog" class="search-form">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" name="q" class="search-input"
                               placeholder="Tìm kiếm bài viết..."
                               th:value="${query}">
                        <button type="submit" class="search-btn">Tìm</button>
                    </div>
                </form>
                <p class="search-result-info" th:if="${query != null and !query.isBlank()}">
                    Tìm thấy <strong th:text="${totalPosts}">0</strong> bài viết cho "<em th:text="${query}">query</em>"
                    · <a href="/blog" class="clear-search">Xóa bộ lọc</a>
                </p>
            </div>

            <!-- Posts grid -->
            <div class="posts-grid" th:if="${!posts.isEmpty()}">
                <article th:each="post : ${posts}" class="post-card">
                    <a th:href="@{/blog/{slug}(slug=${post.slug})}" class="post-card-img-link">
                        <img th:src="${post.coverImage}" th:alt="${post.title}" loading="lazy" class="post-card-img">
                        <span class="post-card-category" th:text="${post.category}">Category</span>
                    </a>
                    <div class="post-card-body">
                        <div class="post-card-meta">
                            <span class="post-date" th:text="${#temporals.format(post.publishedAt, 'dd MMM yyyy')}">Date</span>
                            <span class="post-read-time" th:text="${post.readTimeMinutes + ' phút đọc'}">8 phút đọc</span>
                        </div>
                        <h3 class="post-card-title">
                            <a th:href="@{/blog/{slug}(slug=${post.slug})}" th:text="${post.title}">Title</a>
                        </h3>
                        <p class="post-card-excerpt" th:text="${post.excerpt}">Excerpt</p>
                        <div class="post-card-tags">
                            <span th:each="tag : ${post.tags}" class="tag" th:text="${tag}">Tag</span>
                        </div>
                    </div>
                </article>
            </div>

            <!-- Empty state -->
            <div class="empty-state" th:if="${posts.isEmpty()}">
                <div class="empty-icon">📭</div>
                <h3>Không tìm thấy bài viết nào</h3>
                <p>Hãy thử từ khóa khác hoặc <a href="/blog">xem tất cả bài viết</a>.</p>
            </div>

            <!-- Pagination -->
            <nav class="pagination" th:if="${totalPages > 1}" aria-label="Phân trang">
                <a th:href="@{/blog(page=${currentPage - 1}, q=${query})}"
                   class="page-btn"
                   th:classappend="${currentPage <= 1} ? 'disabled'"
                   aria-label="Trang trước">
                    ← Trước
                </a>
                <div class="page-numbers">
                    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
                        <a th:href="@{/blog(page=${i}, q=${query})}"
                           class="page-num"
                           th:classappend="${i == currentPage} ? 'active'"
                           th:text="${i}">1</a>
                    </span>
                </div>
                <a th:href="@{/blog(page=${currentPage + 1}, q=${query})}"
                   class="page-btn"
                   th:classappend="${currentPage >= totalPages} ? 'disabled'"
                   aria-label="Trang sau">
                    Sau →
                </a>
            </nav>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
